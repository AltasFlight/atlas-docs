<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Atlas Control — Документація</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="canonical" href="https://docs.atlascontrol.pro/uk/">
<script>
  (function () {
    var l;
    try { l = localStorage.getItem('atlas-lang'); } catch (e) {}
    if (l !== 'uk' && l !== 'en') {
      l = (navigator.language || 'uk').toLowerCase().indexOf('uk') === 0 ? 'uk' : 'en';
    }
    location.replace(l + '/');
  })();
</script>
<meta http-equiv="refresh" content="0; url=uk/">
</head>
<body>
<p><a href="uk/">Документація українською</a> · <a href="en/">Documentation in English</a></p>
</body>
</html>
